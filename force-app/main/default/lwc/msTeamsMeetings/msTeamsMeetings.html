<template>
    <section class="workspace" aria-busy={isLoading}>
        <template lwc:if={isLoading}>
            <div class="loading-shell">
                <lightning-spinner alternative-text="Loading Microsoft Teams meetings" size="medium"></lightning-spinner>
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-actions"></div>
                <div class="skeleton-grid">
                    <div class="skeleton skeleton-stat"></div>
                    <div class="skeleton skeleton-stat"></div>
                    <div class="skeleton skeleton-stat"></div>
                    <div class="skeleton skeleton-stat"></div>
                </div>
            </div>
        </template>

        <template lwc:elseif={hasError}>
            <div class="state-panel error-panel" role="alert">
                <lightning-icon icon-name="utility:error" variant="error" size="medium"></lightning-icon>
                <h2>We couldn’t load your meetings</h2>
                <p>{errorMessage}</p>
                <lightning-button label="Retry" icon-name="utility:refresh" variant="brand" onclick={loadWorkspace}></lightning-button>
            </div>
        </template>

        <template lwc:elseif={isMissingRecordContext}>
            <div class="state-panel context-panel">
                <img src={teamsLogoUrl} alt="Microsoft Teams" class="state-logo" />
                <h2>Microsoft Teams Meetings</h2>
                <p>Open a Salesforce record to view its meetings. Lightning App Builder preview does not provide a record ID.</p>
            </div>
        </template>

        <template lwc:elseif={isDisconnected}>
            <div class="state-panel disconnected-panel">
                <img src={teamsLogoUrl} alt="Microsoft Teams" class="state-logo" />
                <h2>Connect your Microsoft 365 account</h2>
                <p>Schedule Teams meetings, sync attendance, recordings and transcripts directly with Salesforce.</p>
                <lightning-button label="Connect Microsoft 365" icon-name="utility:event" variant="brand" onclick={handleConnect} disabled={isConnecting}></lightning-button>
                <div class="secure-copy">
                    <lightning-icon icon-name="utility:lock" size="xx-small"></lightning-icon>
                    <span>Secure Microsoft OAuth connection</span>
                </div>
                <template lwc:if={connectionMessage}>
                    <p class="connection-message">{connectionMessage}</p>
                </template>
            </div>
        </template>

        <template lwc:else>
            <div class="workspace-grid">
                <main class="main-column">
                    <header class="hero-card">
                        <div class="hero-topline">
                            <div class="brand-block">
                                <img src={teamsLogoUrl} alt="Microsoft Teams" class="teams-logo" />
                                <div>
                                    <h1>Microsoft Teams Meetings</h1>
                                    <p>Manage customer meetings, attendance, and conversation intelligence — all in Salesforce.</p>
                                </div>
                            </div>
                            <div class="connection-block">
                                <span class="connected-label"><span class="connection-dot"></span>Connected</span>
                                <span class="connection-email">{connectionEmail}</span>
                            </div>
                        </div>

                        <div class="action-row">
                            <lightning-button label="Schedule Meeting" icon-name="utility:add" variant="brand" onclick={handleSchedule}></lightning-button>
                            <lightning-button label="Sync Meetings" icon-name="utility:sync" onclick={handleSync}></lightning-button>
                            <lightning-button label="Open in Outlook" icon-name="utility:new_window" onclick={handleOpenOutlook}></lightning-button>
                            <lightning-button class="settings-button" label="Settings" icon-name="utility:settings" onclick={handleSettings}></lightning-button>
                        </div>

                        <div class="stats-grid">
                            <article class="stat-card">
                                <span class="stat-icon calendar-icon"><lightning-icon icon-name="utility:event" size="small"></lightning-icon></span>
                                <div><strong>{upcomingCount}</strong><span>Upcoming Meetings</span></div>
                            </article>
                            <article class="stat-card">
                                <span class="stat-icon completed-icon"><lightning-icon icon-name="utility:success" size="small"></lightning-icon></span>
                                <div><strong>{completedCount}</strong><span>Completed Meetings</span></div>
                            </article>
                            <article class="stat-card">
                                <span class="stat-icon recording-icon"><lightning-icon icon-name="utility:video" size="small"></lightning-icon></span>
                                <div><strong>{recordedCount}</strong><span>Recorded Meetings</span></div>
                            </article>
                            <article class="stat-card">
                                <span class="stat-icon action-icon"><lightning-icon icon-name="utility:task" size="small"></lightning-icon></span>
                                <div><strong>0</strong><span>Action Items</span></div>
                            </article>
                        </div>
                    </header>

                    <section class="meetings-card">
                        <nav class="tabs" aria-label="Meeting views">
                            <button class={upcomingTabClass} data-tab="upcoming" onclick={handleTab}>Upcoming Meetings</button>
                            <button class={pastTabClass} data-tab="past" onclick={handleTab}>Past Meetings</button>
                            <button class={recordingsTabClass} data-tab="recordings" onclick={handleTab}>Recordings</button>
                            <button class="tab-button future-tab" disabled title="Planned improvement">Insights</button>
                        </nav>

                        <div class="toolbar">
                            <div class="search-box">
                                <lightning-input type="search" variant="label-hidden" label="Search meetings" placeholder="Search meetings…" onchange={handleSearch}></lightning-input>
                            </div>
                            <lightning-combobox class="status-filter" variant="label-hidden" label="Status" value={statusFilter} options={statusOptions} onchange={handleStatusFilter}></lightning-combobox>
                            <lightning-combobox class="sort-filter" variant="label-hidden" label="Sort meetings" value={sortOrder} options={sortOptions} onchange={handleSort}></lightning-combobox>
                        </div>

                        <template lwc:if={hasVisibleMeetings}>
                            <div class="meeting-list">
                                <template for:each={visibleMeetings} for:item="meeting">
                                    <article key={meeting.id} class={meeting.cardClass}>
                                        <div class="meeting-content">
                                            <div class="meeting-heading">
                                                <img src={teamsLogoUrl} alt="" class="meeting-logo" />
                                                <div class="meeting-primary">
                                                    <div class="title-line">
                                                        <h2>{meeting.subject}</h2>
                                                        <span class={meeting.statusClass}>{meeting.status}</span>
                                                    </div>
                                                    <div class="meeting-time">
                                                        <lightning-icon icon-name="utility:event" size="xx-small"></lightning-icon>
                                                        <span>{meeting.dateLabel}</span><span class="separator">•</span>
                                                        <lightning-icon icon-name="utility:clock" size="xx-small"></lightning-icon>
                                                        <span>{meeting.timeLabel}</span>
                                                    </div>
                                                    <div class="meeting-meta">
                                                        <div class="avatar-stack" aria-label={meeting.attendeeAriaLabel}>
                                                            <template for:each={meeting.attendees} for:item="attendee">
                                                                <span key={attendee.email} class="mini-avatar" title={attendee.email}>{attendee.initials}</span>
                                                            </template>
                                                            <template lwc:if={meeting.extraAttendeeCount}>
                                                                <span class="extra-count">+{meeting.extraAttendeeCount}</span>
                                                            </template>
                                                        </div>
                                                        <span class={meeting.recordingClass}><lightning-icon icon-name="utility:video" size="xx-small"></lightning-icon>{meeting.recordingLabel}</span>
                                                        <span class={meeting.transcriptClass}><lightning-icon icon-name="utility:note" size="xx-small"></lightning-icon>{meeting.transcriptLabel}</span>
                                                    </div>
                                                    <p class="description">{meeting.description}</p>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="meeting-actions">
                                            <template lwc:if={meeting.canJoin}>
                                                <lightning-button data-url={meeting.joinUrl} label="Join Teams" icon-name="utility:video" variant="brand" onclick={handleJoin}></lightning-button>
                                            </template>
                                            <lightning-button data-id={meeting.id} label="Details" onclick={handleDetails}></lightning-button>
                                            <lightning-button-menu data-id={meeting.id} alternative-text="More meeting actions" menu-alignment="right" onselect={handleMeetingMenu}>
                                                <lightning-menu-item value="participants" label="Participants"></lightning-menu-item>
                                                <lightning-menu-item value="recording" label="Recording &amp; Transcript"></lightning-menu-item>
                                                <lightning-menu-item value="cancel" label="Cancel Meeting"></lightning-menu-item>
                                                <lightning-menu-item value="delete" label="Delete Meeting"></lightning-menu-item>
                                            </lightning-button-menu>
                                        </div>

                                        <aside class="record-context">
                                            <span class="record-icon"><lightning-icon icon-name="standard:record" size="small"></lightning-icon></span>
                                            <div><strong>{recordName}</strong><span>{objectLabel}</span></div>
                                        </aside>
                                    </article>
                                </template>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="empty-state">
                                <img src={teamsLogoUrl} alt="" class="empty-logo" />
                                <h2>{emptyTitle}</h2>
                                <p>{emptyMessage}</p>
                                <template lwc:if={showEmptyScheduleAction}>
                                    <lightning-button label="Schedule Meeting" variant="brand" onclick={handleSchedule}></lightning-button>
                                </template>
                            </div>
                        </template>
                    </section>
                </main>

                <aside class="side-column">
                    <section class="side-card calendar-card">
                        <div class="side-heading"><h2>My Calendar</h2><lightning-button-icon icon-name="utility:chevronleft" alternative-text="Previous month" onclick={previousMonth}></lightning-button-icon><lightning-button-icon icon-name="utility:chevronright" alternative-text="Next month" onclick={nextMonth}></lightning-button-icon></div>
                        <h3>{calendarMonthLabel}</h3>
                        <div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
                        <div class="calendar-grid">
                            <template for:each={calendarDays} for:item="day">
                                <span key={day.key} class={day.className}>{day.label}</span>
                            </template>
                        </div>
                        <div class="today-heading"><h3>Upcoming</h3><button onclick={handleViewAll}>View All</button></div>
                        <template for:each={calendarMeetings} for:item="meeting">
                            <button key={meeting.id} class="calendar-meeting" data-id={meeting.id} onclick={handleDetails}>
                                <span class="calendar-dot"></span><span><strong>{meeting.subject}</strong><small>{meeting.shortTimeLabel}</small></span>
                            </button>
                        </template>
                    </section>

                    <section class="side-card quick-actions">
                        <h2>Quick Actions</h2>
                        <button onclick={handleSchedule}><lightning-icon icon-name="utility:event" size="x-small"></lightning-icon><span>Schedule Meeting</span><lightning-icon icon-name="utility:chevronright" size="xx-small"></lightning-icon></button>
                        <button onclick={handleSync}><lightning-icon icon-name="utility:sync" size="x-small"></lightning-icon><span>Sync Meetings</span><lightning-icon icon-name="utility:chevronright" size="xx-small"></lightning-icon></button>
                        <button onclick={handleOpenOutlook}><lightning-icon icon-name="utility:new_window" size="x-small"></lightning-icon><span>Open in Outlook</span><lightning-icon icon-name="utility:chevronright" size="xx-small"></lightning-icon></button>
                    </section>
                </aside>
            </div>
        </template>
    </section>
    <template lwc:if={showScheduleModal}>
        <c-ms-teams-meeting-form
            record-id={recordId}
            context={context}
            onclose={handleScheduleClose}
            onscheduled={handleMeetingScheduled}>
        </c-ms-teams-meeting-form>
    </template>
    <template lwc:if={selectedMeetingId}>
        <c-ms-teams-meeting-details
            record-id={recordId}
            meeting-id={selectedMeetingId}
            initial-tab={selectedDetailsTab}
            context={context}
            onclose={handleDetailsClose}
            onnavigate={handleDetailsNavigate}
            onaction={handleDetailsAction}>
        </c-ms-teams-meeting-details>
    </template>
</template>
