<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Meeting Details" class="modal">
        <div class="shell">
            <template lwc:if={loading}><div class="loading"><lightning-spinner alternative-text="Loading meeting details"></lightning-spinner></div></template>
            <template lwc:elseif={hasError}><div class="error"><lightning-icon icon-name="utility:error" variant="error" size="medium"></lightning-icon><h2>We couldn’t load this meeting</h2><p>{errorMessage}</p><lightning-button label="Retry" icon-name="utility:refresh" variant="brand" onclick={load}></lightning-button><lightning-button label="Close" onclick={close}></lightning-button></div></template>
            <template lwc:else>
                <header class="header">
                    <div class="heading"><img src={teamsLogoUrl} alt="Microsoft Teams"/><div><div class="title-row"><h1>{meeting.subject}</h1><span class={statusClass}>{meeting.status}</span></div><p>{dateLabel} · {timeLabel} · {durationLabel}</p></div></div>
                    <div class="actions"><template lwc:if={canJoin}><lightning-button label="Join Teams" icon-name="utility:video" variant="brand" onclick={join}></lightning-button></template><template lwc:if={hasWebLink}><lightning-button label="Open in Outlook" icon-name="utility:new_window" onclick={openOutlook}></lightning-button></template><lightning-button-menu alternative-text="More actions" menu-alignment="right" onselect={moreAction}><lightning-menu-item value="cancel" label="Cancel Meeting"></lightning-menu-item><lightning-menu-item value="delete" label="Delete Meeting"></lightning-menu-item></lightning-button-menu><button class="close" onclick={close} aria-label="Close">×</button></div>
                </header>
                <nav class="tabs"><button class="active" data-tab="overview" onclick={chooseTab}>Overview</button><button data-tab="participants" onclick={chooseTab}>Participants</button><button data-tab="transcript" onclick={chooseTab}>Transcript</button><button data-tab="recording" onclick={chooseTab}>Recording</button><button data-tab="insights" onclick={chooseTab}>Insights</button><button data-tab="activity" onclick={chooseTab}>Activity</button></nav>
                <main class="body">
                    <div class="stats"><article><span class="stat-icon invited"><lightning-icon icon-name="utility:groups" size="small"></lightning-icon></span><strong>{participantCount}</strong><small>Invited</small></article><article><span class="stat-icon attended"><lightning-icon icon-name="utility:check" size="small"></lightning-icon></span><strong>{attendedCount}</strong><small>Attended</small></article><article><span class="stat-icon duration"><lightning-icon icon-name="utility:clock" size="small"></lightning-icon></span><strong>{durationLabel}</strong><small>Duration</small></article><article><span class="stat-icon recording"><lightning-icon icon-name="utility:video" size="small"></lightning-icon></span><strong>{recordingLabel}</strong><small>Recording</small></article><article><span class="stat-icon transcript"><lightning-icon icon-name="utility:note" size="small"></lightning-icon></span><strong>{transcriptLabel}</strong><small>Transcript</small></article></div>
                    <div class="info-grid">
                        <section class="card meeting-info"><h2>Meeting Information</h2><div class="organizer"><span class="avatar">OR</span><div><small>Organizer</small><strong>{organizerEmail}</strong></div></div><dl><dt>Meeting type</dt><dd>{meetingType}</dd><dt>Location</dt><dd>{location}</dd><dt>Time zone</dt><dd>{meeting.timeZone}</dd></dl></section>
                        <section class="card"><h2>Related To</h2><template lwc:if={hasRelatedRecords}><template for:each={relatedRecords} for:item="record"><div key={record.key} class="related"><lightning-icon icon-name="standard:record" size="small"></lightning-icon><div><small>{record.objectLabel} · {record.relationshipRole}</small><strong>{record.label}</strong></div></div></template></template></section>
                    </div>
                    <section class="card agenda"><h2>Description / Agenda</h2><p>{description}</p></section>
                    <div class="lower-grid"><section class="card"><h2>Teams Configuration</h2><div class="setting"><span>Meeting chat</span><b>{chatLabel}</b></div><div class="setting"><span>Screen sharing</span><b>{sharingLabel}</b></div><div class="setting"><span>Lobby</span><b>{lobbyLabel}</b></div><div class="setting"><span>Access</span><b>{details.meetingAccess}</b></div></section><section class="card next"><h2>Next Steps</h2><p>Participant attendance will appear after synchronization.</p><p>Recording and transcript availability will update as Microsoft finishes processing them.</p><lightning-button label="View Participants" data-tab="participants" onclick={chooseTab}></lightning-button></section></div>
                    <template lwc:if={syncError}><div class="sync-warning"><lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon><span>{syncError}</span></div></template>
                </main>
            </template>
        </div>
    </section><div class="backdrop"></div>
</template>
